[project]
name = "fox"
version = "0.1.0"
description = "Contracts and effects for Python functions"
readme = "README.md"
authors = [{ name = "Adam Byrne", email = "adamrbyrne@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["hypothesis>=6.100", "typing_extensions>=4.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.9"
